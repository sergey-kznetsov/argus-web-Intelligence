name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUS_TEST_POSTGRES_DSN: postgresql://argus:argus@127.0.0.1:5432/argus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: playwright install --with-deps chromium
      - run: python -m compileall -q src tests
      - run: ruff check src tests
      - run: pytest -q --cov=argus --cov-report=term-missing
