name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUS_TEST_POSTGRES_DSN: postgresql://argus:argus@127.0.0.1:5432/argus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pip install 'pip-audit==2.10.1'
      - run: pip check
      - run: pip-audit --local
      - run: playwright install --with-deps chromium
      - name: Enable Chromium sandbox user namespaces
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: python -m compileall -q src tests
      - run: ruff check src tests
      - name: Security lint production sources
        run: ruff check src --select S
      - name: Verify standalone server deployment contract
        run: pytest -q tests/test_server_deployment_contract.py
      - name: Run pytest with coverage
        run: pytest -q --cov=argus --cov-report=term-missing --cov-fail-under=80 2>&1 | tee pytest.log
      - name: Preserve pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: pytest.log
          retention-days: 3
          if-no-files-found: error

  windows-runtime:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src tests/test_windows_runtime.py
      - run: ruff check src/argus/platform_asyncio.py src/argus/runtime_entrypoint.py src/argus/crawler/browser/windows_runtime.py tests/test_windows_runtime.py
      - run: pytest -q tests/test_windows_runtime.py
      - name: Parse standalone Windows deployment scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @(
            "deploy/windows/deploy-server.ps1",
            "deploy/windows/run-process.ps1",
            "deploy/windows/configure-geo-analyzer-consumer.ps1"
          )) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $script"
            }
          }
      - name: Start PostgreSQL 14 on Windows Server 2022
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-14 -StartupType Manual
          Start-Service -Name postgresql-x64-14
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432 -U postgres
      - name: Standalone runtime entrypoint smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PGPASSWORD = "root"
          $env:GEOANALYZER_DATABASE_DSN = "postgresql://postgres:root@127.0.0.1:5432/postgres"
          $env:ARGUS_TOKEN_FILE = Join-Path $env:RUNNER_TEMP "argus-token"
          $env:ARGUS_STORAGE_BACKEND = "postgresql"
          $env:ARGUS_WAYBACK_CDX_URL = "https://web.archive.org/cdx/search/cdx"
          $env:PYTHONUNBUFFERED = "1"

          python -m argus.runtime_entrypoint storage migrate
          python -m argus.runtime_entrypoint storage check

          $apiOut = Join-Path $env:RUNNER_TEMP "argus-api.out.log"
          $apiErr = Join-Path $env:RUNNER_TEMP "argus-api.err.log"
          $workerOut = Join-Path $env:RUNNER_TEMP "argus-worker.out.log"
          $workerErr = Join-Path $env:RUNNER_TEMP "argus-worker.err.log"

          $env:ARGUS_EXECUTION_ROLE = "api"
          $api = Start-Process python -ArgumentList @(
            "-m", "argus.runtime_entrypoint", "api",
            "--host", "127.0.0.1", "--port", "18100"
          ) -PassThru -RedirectStandardOutput $apiOut -RedirectStandardError $apiErr

          $env:ARGUS_EXECUTION_ROLE = "worker"
          $worker = Start-Process python -ArgumentList @(
            "-m", "argus.runtime_entrypoint", "worker",
            "--probe-host", "127.0.0.1", "--probe-port", "18101"
          ) -PassThru -RedirectStandardOutput $workerOut -RedirectStandardError $workerErr

          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($api.HasExited -or $worker.HasExited) {
                Write-Host "API exited=$($api.HasExited) code=$($api.ExitCode)"
                Write-Host "Worker exited=$($worker.HasExited) code=$($worker.ExitCode)"
                if (Test-Path $apiOut) { Get-Content $apiOut }
                if (Test-Path $apiErr) { Get-Content $apiErr }
                if (Test-Path $workerOut) { Get-Content $workerOut }
                if (Test-Path $workerErr) { Get-Content $workerErr }
                throw "ARGUS process exited before health-check"
              }

              if (Test-Path $env:ARGUS_TOKEN_FILE) {
                $token = (Get-Content $env:ARGUS_TOKEN_FILE -Raw).Trim()
                try {
                  $headers = @{ Authorization = "Bearer $token" }
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:18100/v1/health" -Headers $headers -TimeoutSec 5
                  $workerHealth = Invoke-RestMethod -Uri "http://127.0.0.1:18101/readyz" -TimeoutSec 5
                  if ($health.status -eq "ok" -and $workerHealth.status -eq "ok") {
                    $ready = $true
                    break
                  }
                } catch {
                  # Startup is asynchronous; retry until the bounded deadline.
                }
              }
              Start-Sleep -Seconds 1
            }

            if (-not $ready) {
              if (Test-Path $apiOut) { Get-Content $apiOut }
              if (Test-Path $apiErr) { Get-Content $apiErr }
              if (Test-Path $workerOut) { Get-Content $workerOut }
              if (Test-Path $workerErr) { Get-Content $workerErr }
              throw "ARGUS Windows runtime did not become healthy"
            }

            $token = (Get-Content $env:ARGUS_TOKEN_FILE -Raw).Trim()
            $headers = @{ Authorization = "Bearer $token" }
            $manifest = Invoke-RestMethod -Uri "http://127.0.0.1:18100/v1/manifest" -Headers $headers -TimeoutSec 5
            if ($manifest.module_id -ne "argus.web.intelligence") {
              throw "Unexpected ARGUS protocol identity"
            }
          }
          finally {
            foreach ($process in @($worker, $api)) {
              if ($null -ne $process -and -not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }
      - name: Standalone Windows service runner smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $env:RUNNER_TEMP "argus-runner-release"
          $config = Join-Path $env:RUNNER_TEMP "argus-runner.env"
          $tokenFile = Join-Path $env:RUNNER_TEMP "argus-runner.token"
          $dsnFile = Join-Path $env:RUNNER_TEMP "argus-runner-dsn.txt"
          $logs = Join-Path $env:RUNNER_TEMP "argus-runner-logs"
          $runner = (Resolve-Path "deploy/windows/run-process.ps1").Path

          New-Item -ItemType Directory -Path $release -Force | Out-Null
          New-Item -ItemType Directory -Path $logs -Force | Out-Null
          python -m venv --system-site-packages (Join-Path $release ".venv")

          [IO.File]::WriteAllText($tokenFile, "ci-runner-token`n")
          [IO.File]::WriteAllText($dsnFile, "postgresql://postgres:root@127.0.0.1:5432/postgres`n")
          [IO.File]::WriteAllLines($config, @(
            "ARGUS_HOST=127.0.0.1",
            "ARGUS_PORT=18102",
            "ARGUS_WORKER_PROBE_PORT=18103",
            "ARGUS_TOKEN_FILE=$tokenFile",
            "ARGUS_STORAGE_BACKEND=postgresql",
            "ARGUS_DATABASE_DSN_FILE=$dsnFile",
            "ARGUS_LOG_DIR=$logs",
            "ARGUS_LLM_REQUIRED=false"
          ))

          $api = Start-Process powershell.exe -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", "`"$runner`"",
            "-Role", "api",
            "-ReleaseRoot", "`"$release`"",
            "-ConfigFile", "`"$config`""
          ) -PassThru

          $worker = Start-Process powershell.exe -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", "`"$runner`"",
            "-Role", "worker",
            "-ReleaseRoot", "`"$release`"",
            "-ConfigFile", "`"$config`""
          ) -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              $api.Refresh()
              $worker.Refresh()
              if ($api.HasExited -or $worker.HasExited) {
                Write-Host "Runner API exited=$($api.HasExited) code=$($api.ExitCode)"
                Write-Host "Runner worker exited=$($worker.HasExited) code=$($worker.ExitCode)"
                foreach ($log in @("api.log", "worker.log")) {
                  $path = Join-Path $logs $log
                  if (Test-Path $path) {
                    Write-Host "=== $log ==="
                    Get-Content $path
                  }
                }
                throw "ARGUS Windows service runner exited before health-check"
              }

              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18102/v1/health" -TimeoutSec 5
                $workerHealth = Invoke-RestMethod -Uri "http://127.0.0.1:18103/readyz" -TimeoutSec 5
                if ($health.status -eq "ok" -and $workerHealth.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                # Startup is asynchronous; retry until the bounded deadline.
              }
              Start-Sleep -Seconds 1
            }

            if (-not $ready) {
              foreach ($log in @("api.log", "worker.log")) {
                $path = Join-Path $logs $log
                if (Test-Path $path) {
                  Write-Host "=== $log ==="
                  Get-Content $path
                }
              }
              throw "ARGUS Windows service runner did not become healthy"
            }
          }
          finally {
            foreach ($process in @($worker, $api)) {
              if ($null -ne $process -and -not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }
