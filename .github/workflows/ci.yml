name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUS_TEST_POSTGRES_DSN: postgresql://argus:argus@127.0.0.1:5432/argus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pip install 'pip-audit==2.10.1'
      - run: pip check
      - run: pip-audit --local
      - run: playwright install --with-deps chromium
      - name: Enable Chromium sandbox user namespaces
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: python -m compileall -q src tests
      - run: ruff check src tests
      - name: Security lint production sources
        run: ruff check src --select S
      - name: Run pytest with coverage
        run: pytest -q --cov=argus --cov-report=term-missing --cov-fail-under=80 2>&1 | tee pytest.log
      - name: Preserve pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: pytest.log
          retention-days: 3
          if-no-files-found: error
