name: live-perm-ai-acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-perm-ai-acceptance.yml
      - scripts/perm_ai_acceptance.py
      - src/argus/bootstrap.py
      - src/argus/contracts/**
      - src/argus/crawler/**
      - src/argus/orchestrator/**
      - src/argus/research/**
      - src/argus/sources/**

permissions:
  contents: read

jobs:
  perm-ai-acceptance:
    name: perm-${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [kraken, janus, historical]
    env:
      ARGUS_OLLAMA_MODEL: qwen3:0.6b
      ARGUS_LLM_REQUIRED: "true"
      ARGUS_AGENT_ENABLED: "true"
      ARGUS_BROWSER_SERP_ENABLED: "true"
      ARGUS_MAX_CONCURRENCY: "2"
      ARGUS_BROWSER_MAX_CONCURRENCY: "1"
      ARGUS_PER_DOMAIN_DELAY_SECONDS: "0.5"
      ARGUS_LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ARGUS
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke acceptance imports
        run: |
          python -c "from argus.web.app import create_web_app; from argus.web.profiles import web_test_profiles; from scripts.perm_ai_acceptance import _request; print('live acceptance imports ok')"

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Enable Chromium sandbox user namespaces
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install pinned Ollama
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/ollama/ollama/releases/download/v0.32.14/install.sh \
            --output /tmp/ollama-install.sh
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  /tmp/ollama-install.sh" \
            | sha256sum --check --strict
          OLLAMA_VERSION=0.32.14 sh /tmp/ollama-install.sh

      - name: Start local Ollama and pull bounded acceptance model
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/ollama.log
              exit 1
            fi
            sleep 1
          done
          ollama pull qwen3:0.6b
          curl --fail --silent http://127.0.0.1:11434/api/tags

      - name: Run real Perm AI acceptance profile
        run: python scripts/perm_ai_acceptance.py --profile "${{ matrix.profile }}"

      - name: Show acceptance overview
        if: always()
        run: |
          file=".argus/probes/perm-ai-acceptance/overview-${{ matrix.profile }}.json"
          if [ -f "$file" ]; then
            cat "$file"
          fi

      - name: Upload factual probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perm-ai-acceptance-${{ matrix.profile }}
          path: |
            .argus/probes/perm-ai-acceptance
            /tmp/ollama.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
